name: Update Sanctions Tree

# Builds the tree from live feeds and opens a PR for review. It never relays a root on-chain:
# relaying happens only from merged main, in sanctions-relay.yml.

on:
  schedule:
    # Daily at 06:00 UTC — after OFAC SDN list typically updates
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

# Never cancel a run that may be mid-push; let a second trigger wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-sanctions-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: npm ci

      # The tree builder needs only the runtime dependencies (no zk/dev extras).
      - run: uv sync --locked

      - name: Build sanctions Merkle tree
        run: uv run python scripts/build_sanctions_tree.py

      # Pilot tree is derived from the same normalized feed output and independently re-verified.
      # Publishing the Kind.Sanctions head needs a registrar signature and human confirmation,
      # so it is never automated here (see make publish-pilot-sanctions-head).
      - name: Build and verify pilot sanctions tree
        run: |
          uv run python scripts/build_pilot_sanctions_tree.py
          uv run python scripts/build_pilot_sanctions_tree.py --verify

      - name: Upload sanctions tree artifacts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanctions-trees
          path: |
            artifacts/sanctions_tree.json
            artifacts/pilot_sanctions_tree.json
          retention-days: 30
          if-no-files-found: error

      # artifacts/ is ignored, so `git diff` never reports a rebuilt tree. Compare tree roots
      # against the copies committed at HEAD instead: a first publication is a change, a new
      # fetch timestamp alone is not. The same step enforces the 50% leaf-count floor.
      - name: Compare with the reviewed trees on main
        id: diff
        run: uv run python scripts/sanctions_tree_diff.py --ref HEAD --github-output "$GITHUB_OUTPUT"

      - name: Create branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_LEAF_COUNT: ${{ steps.diff.outputs.prev_count }}
          NEW_LEAF_COUNT: ${{ steps.diff.outputs.new_count }}
          PILOT_PREV_LEAF_COUNT: ${{ steps.diff.outputs.pilot_prev_count }}
          PILOT_NEW_LEAF_COUNT: ${{ steps.diff.outputs.pilot_new_count }}
          LEGACY_CHANGED: ${{ steps.diff.outputs.legacy_changed }}
          PILOT_CHANGED: ${{ steps.diff.outputs.pilot_changed }}
        run: |
          # One rolling review branch: an unmerged update is refreshed in place instead of
          # opening another PR every day.
          BRANCH_NAME="sanctions-update/pending"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          # Both reviewed trees live on main; -f is required because artifacts/ is ignored.
          git add -f artifacts/sanctions_tree.json artifacts/pilot_sanctions_tree.json
          git commit -m "chore: update sanctions Merkle trees (automated daily refresh)"
          git push --force origin "$BRANCH_NAME"
          BODY="Automated sanctions tree rebuild from OFAC/EU feeds on $(date +%Y-%m-%d). Please review leaf count changes before merging.

          **Legacy tree (artifacts/sanctions_tree.json):** root changed: $LEGACY_CHANGED; leaves $PREV_LEAF_COUNT -> $NEW_LEAF_COUNT
          **Pilot tree (artifacts/pilot_sanctions_tree.json):** root changed: $PILOT_CHANGED; leaves $PILOT_PREV_LEAF_COUNT -> $PILOT_NEW_LEAF_COUNT

          Merging this PR triggers the **Relay Sanctions Root** workflow (sanctions-relay.yml) when the legacy
          tree changed, which relays the merged root to the configured chains. The pilot tree is committed here
          as the durable published copy for independent re-verification
          (\`uv run python scripts/build_pilot_sanctions_tree.py --verify\`). It is not published on-chain by
          merging: a registrar signs a sanctions-root snapshot for its root/source digest, then run
          \`make publish-pilot-sanctions-head\` per pilot deployment. To relay the legacy root manually instead:
          \`\`\`
          RELAY_NETWORKS=sepolia,base-sepolia,arbitrum-sepolia make relay-sanctions
          \`\`\`"
          OPEN_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --body "$BODY"
          else
            gh pr create --head "$BRANCH_NAME" --title "chore: sanctions tree update" --body "$BODY"
          fi
