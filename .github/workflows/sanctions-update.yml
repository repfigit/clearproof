name: Update Sanctions Tree

# Builds the tree from live feeds and opens a PR for review. It never relays a root on-chain:
# relaying happens only from merged main, in sanctions-relay.yml.

on:
  schedule:
    # Daily at 06:00 UTC — after OFAC SDN list typically updates
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

# Never cancel a run that may be mid-push; let a second trigger wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-sanctions-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - run: npm ci

      # The tree builder needs only the runtime dependencies (no zk/dev extras).
      - run: uv sync --locked

      - name: Save previous leaf count
        id: prev
        run: |
          if [ -f artifacts/sanctions_tree.json ]; then
            PREV_COUNT=$(python3 -c "import json; d=json.load(open('artifacts/sanctions_tree.json')); print(len(d.get('leaves', d.get('entries', []))))" 2>/dev/null || echo "0")
          else
            PREV_COUNT=0
          fi
          echo "leaf_count=$PREV_COUNT" >> "$GITHUB_OUTPUT"

      - name: Build sanctions Merkle tree
        run: uv run python scripts/build_sanctions_tree.py

      # Pilot tree is derived from the same normalized feed output and independently re-verified.
      # Publishing the Kind.Sanctions head needs a registrar signature and human confirmation,
      # so it is never automated here (see make publish-pilot-sanctions-head).
      - name: Build and verify pilot sanctions tree
        run: |
          uv run python scripts/build_pilot_sanctions_tree.py
          uv run python scripts/build_pilot_sanctions_tree.py --verify

      - name: Upload sanctions tree artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanctions-trees
          path: |
            artifacts/sanctions_tree.json
            artifacts/pilot_sanctions_tree.json
          retention-days: 30

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet artifacts/sanctions_tree.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sanity check leaf count
        if: steps.diff.outputs.changed == 'true'
        id: sanity
        env:
          PREV_COUNT: ${{ steps.prev.outputs.leaf_count }}
        run: |
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('artifacts/sanctions_tree.json')); print(len(d.get('leaves', d.get('entries', []))))" 2>/dev/null || echo "0")
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "Previous leaf count: $PREV_COUNT"
          echo "New leaf count: $NEW_COUNT"

          if [ "$PREV_COUNT" -gt 0 ] && [ "$NEW_COUNT" -gt 0 ]; then
            # Check if the new count dropped by more than 50%
            THRESHOLD=$(( PREV_COUNT / 2 ))
            if [ "$NEW_COUNT" -lt "$THRESHOLD" ]; then
              echo "::error::Sanctions leaf count dropped more than 50% ($PREV_COUNT -> $NEW_COUNT). Aborting — this may indicate a data source issue."
              exit 1
            fi
          fi

      - name: Create branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_LEAF_COUNT: ${{ steps.prev.outputs.leaf_count }}
          NEW_LEAF_COUNT: ${{ steps.sanity.outputs.new_count }}
        run: |
          BRANCH_NAME="sanctions-update/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add artifacts/sanctions_tree.json
          git commit -m "chore: update sanctions Merkle tree (automated daily refresh)"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "chore: sanctions tree update $(date +%Y-%m-%d)" \
            --body "Automated sanctions tree rebuild from OFAC/EU feeds. Please review leaf count changes before merging.

          **Previous leaf count:** $PREV_LEAF_COUNT
          **New leaf count:** $NEW_LEAF_COUNT

          Merging this PR triggers the **Relay Sanctions Root** workflow (sanctions-relay.yml), which relays
          the merged root to the configured chains. The pilot tree (artifacts/pilot_sanctions_tree.json) is attached to
          the workflow run: a registrar signs a sanctions-root snapshot for its root/source digest, then run
          \`make publish-pilot-sanctions-head\` per pilot deployment. To relay the legacy root manually instead:
          \`\`\`
          RELAY_NETWORKS=sepolia,base-sepolia,arbitrum-sepolia make relay-sanctions
          \`\`\`"
