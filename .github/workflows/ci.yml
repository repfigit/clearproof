name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
# Every job uses the same Node LTS (24). Release publishing needs Node >= 22.14 for npm trusted publishing.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check src tests scripts
      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

  pilot-root-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra dev
      # The Hardhat PilotRootCheckpoint contract tests run as part of the full suite in hardhat-tests.
      - name: Python checkpoint verification on an isolated local EVM
        run: uv run python scripts/test_checkpoint_evm.py

  pilot-credential-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra dev
      - name: Install pinned Circom for witness checks
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64 -o /tmp/pilot-circom
          echo 'f3d8d1fdbc123779b80e210c909ee941d7a1e130c70365524646b48b8b0fe9d5  /tmp/pilot-circom' | sha256sum --check
          sudo install /tmp/pilot-circom /usr/local/bin/circom
          circom --version
          node --version
      - name: Real credential, valuation and projection constraints
        run: uv run python -m pytest tests/unit/test_pilot_credential.py tests/unit/test_pilot_valuation.py tests/unit/test_pilot_projection.py tests/unit/test_pilot_compliance.py tests/unit/test_wallet_ownership.py -q

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Discovery profile, real TLS, encryption policy and SIWE compatibility
        run: >-
          uv run python -m pytest -q
          tests/unit/test_discovery.py tests/unit/test_recipient_encryption_policy.py
          tests/unit/test_siwe_compatibility.py tests/integration/test_discovery_transport.py
          tests/integration/test_api_endpoints.py

  proof-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clearproof_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clearproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/clearproof_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build policy CLI and its workspace dependencies
        run: |
          npm run build --workspace @clearproof/content
          npm run build --workspace @clearproof/proof
          npm run build --workspace @clearproof/cli
      - name: Real PostgreSQL proof storage, migration and parsing checks
        env:
          CLEARPROOF_POLICY_CLI_TEST: "1"
        run: uv run python -m pytest tests/integration/test_storage.py tests/integration/test_proof_persistence.py tests/integration/test_proof_storage.py tests/integration/test_pilot_storage.py tests/integration/test_pilot_readiness.py tests/integration/test_enrollment_inventory.py tests/integration/test_publication_journal.py tests/integration/test_wallet_ownership.py tests/unit/test_stored_signals.py tests/unit/test_pilot_cipher.py -q

  # Required check. Fast full-suite run without coverage on the minimum supported Python (3.11,
  # pyproject requires-python). The `circuits` job runs the same suite on the default runner Python
  # with PostgreSQL and real artifacts and owns the 100% coverage gate (with python-aggregate-coverage).
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra dev
      - run: uv run python --version
      - run: uv run python -m pytest tests -q

  typescript-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build @clearproof/content (dependency of cli)
        run: cd packages/content && npx tsc
      - name: Build @clearproof/proof (dependency of cli)
        run: cd packages/proof && npx tsc
      - run: cd packages/proof && npx tsc --noEmit
      - run: cd packages/cli && npx tsc
      - name: Content parser and catalogue coverage
        run: npm run test:coverage --workspace=@clearproof/content
      - name: All CLI tests and source coverage
        run: npm run test:coverage --workspace=@clearproof/cli
      - name: SDK tests and source coverage
        run: npm run test:coverage --workspace=@clearproof/proof
      - name: Docs content API tests and source coverage
        run: npm run test:coverage --workspace=@clearproof/docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typescript-coverage
          path: |
            packages/content/coverage/
            packages/cli/coverage/
            packages/proof/coverage/
            apps/docs/coverage/
          if-no-files-found: error

  operational-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: operational-coverage.data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra dev
      # Partial evidence: pyproject's fail_under = 100 is applied to the selected files below and
      # to the combined data in python-aggregate-coverage, not to this subset run.
      - name: Check canonical pilot constant generation
        run: uv run python scripts/generate_signal_constants.py --check
      - name: Operational Python coverage and real Node helper acceptance
        run: >-
          uv run python -m pytest
          tests/unit/test_l2_cost_model.py tests/unit/test_poseidon.py
          tests/unit/test_deterministic_tree.py tests/unit/test_development_runner.py
          tests/unit/test_hpke_keygen_script.py tests/unit/test_poseidon_script.py
          tests/unit/test_poseidon_generator.py
          tests/unit/test_signal_generator.py
          tests/unit/test_bls_input_script.py
          tests/unit/test_sanctions_sources.py
          tests/unit/test_checkpoint_runner.py
          tests/unit/test_pilot_local_runner.py
          tests/unit/test_pilot_preflight.py
          tests/unit/test_pilot_mirror_reports.py
          tests/unit/test_pilot_mirror_runner.py
          tests/unit/test_development_setup.py
          tests/unit/test_circuit_lint_script.py
          tests/unit/test_regen_protobufs_script.py
          tests/unit/test_compile_circuits_script.py
          tests/unit/test_build_pilot_sanctions_tree_script.py
          tests/unit/test_publish_pilot_sanctions_head_script.py
          --cov=scripts --cov-branch --cov-report=json:operational-coverage.json
          --cov-report=term-missing --cov-fail-under=0 -q
      - name: Preserve completed operational script coverage
        run: >-
          uv run python -m coverage report
          --include="scripts/hpke_keygen.py,scripts/l2_cost_model.py,scripts/generate_poseidon_constants.py,scripts/generate_signal_constants.py,scripts/make_bls_input.py,scripts/build_sanctions_tree.py,scripts/test_checkpoint_evm.py,scripts/test_pilot_local.py,scripts/test_pilot_mirror.py,scripts/build_pilot_sanctions_tree.py,scripts/publish_pilot_sanctions_head.py"
          --fail-under=100
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operational-python-coverage
          path: |
            operational-coverage.json
            operational-coverage.data
          if-no-files-found: error
          retention-days: 7

  operational-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@clearproof/proof
      - name: Inspect the real historical proof and reject a tampered statement
        run: node scripts/inspect_example.mjs
      - run: npm run test:scripts:coverage
      - run: npm run test:contract-scripts:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operational-javascript-coverage
          path: |
            coverage/scripts/
            coverage/contract-scripts/
          if-no-files-found: error
          retention-days: 7

  docs-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Always run: system dependencies are not cached, and cached browsers are skipped.
      - run: npm exec --workspace=@clearproof/docs -- playwright install --with-deps chromium firefox webkit
      - run: npm run build --workspace=@clearproof/content
      - run: npm run build --workspace=@clearproof/docs
      - name: Production MDX pages, navigation and content APIs
        run: npm run test:e2e --workspace=@clearproof/docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs-browser-evidence
          path: |
            apps/docs/playwright-report/
            apps/docs/test-results/
          retention-days: 7

  # Required check. Full Hardhat suite without real circuit artifacts (fixture-gated tests skip);
  # the circuits job re-runs it with fresh legacy and pilot artifacts.
  hardhat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cd packages/contracts && npx hardhat test
      - run: npm run typecheck --workspace=@clearproof/contracts

  development-circuits:
    name: UNAPPROVED development circuits
    runs-on: ubuntu-latest
    # Local phase-2 preparation exceeded 30 minutes at 2^16; CI now uses pinned prepared parameters.
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clearproof_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clearproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra dev
      - name: Install pinned Circom
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64 -o /tmp/pilot-circom
          echo 'f3d8d1fdbc123779b80e210c909ee941d7a1e130c70365524646b48b8b0fe9d5  /tmp/pilot-circom' | sha256sum --check
          sudo install /tmp/pilot-circom /usr/local/bin/circom
      - name: Cache pinned phase-1 parameters
        id: ptau-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ppot_0080_17.ptau
          key: ptau-ppot_0080_17-f807e065fde53f72f4bf4d57140fab85b26daa6cc95bdfec7cce93622b3a367c
      - name: Download pinned phase-1 parameters (PSE perpetual powers of tau, 2^17)
        # Public multi-party phase 1 (80 contributions). The phase-2 keys produced below remain
        # unapproved development keys; this is not a production ceremony.
        if: steps.ptau-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --max-time 600 https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_17.ptau -o "$RUNNER_TEMP/ppot_0080_17.ptau"
      - name: Verify phase-1 parameters (cached or downloaded)
        run: echo "f807e065fde53f72f4bf4d57140fab85b26daa6cc95bdfec7cce93622b3a367c  $RUNNER_TEMP/ppot_0080_17.ptau" | sha256sum --check
      - name: UNAPPROVED development setup, input-derived parity and real proofs for both profiles
        env:
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-development.data
        run: uv run python -m coverage run --parallel-mode --branch --source=scripts scripts/test_development_circuits.py "$RUNNER_TEMP/clearproof-development-circuits" --prepared-ptau "$RUNNER_TEMP/ppot_0080_17.ptau"
      # Steps below collect partial coverage evidence with --cov-fail-under=0 / --fail-under=0; the
      # 100% gates (pyproject fail_under) are the explicit `coverage report` calls on combined data.
      - name: Development setup failure paths and coverage gate
        run: |
          COVERAGE_FILE="$RUNNER_TEMP/python-coverage-development.data" uv run python -m coverage combine --keep "$RUNNER_TEMP"
          COVERAGE_FILE="$RUNNER_TEMP/python-coverage-development-unit.data" uv run python -m pytest tests/unit/test_development_setup.py tests/unit/test_development_runner.py --cov=scripts --cov-branch --cov-report= --cov-fail-under=0 -q
          export COVERAGE_FILE="$RUNNER_TEMP/python-coverage-development-combined.data"
          uv run python -m coverage combine --keep "$RUNNER_TEMP/python-coverage-development.data" "$RUNNER_TEMP/python-coverage-development-unit.data"
          uv run python -m coverage json -o "$RUNNER_TEMP/python-coverage-development-combined.json" --fail-under=0
          uv run python -m coverage report --include=scripts/test_development_circuits.py --fail-under=100
      - name: Contract fixture generation and rejection with real proofs
        env:
          CLEARPROOF_PILOT_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/pilot
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-contract-fixture.data
        run: |
          uv run python -m pytest tests/unit/test_pilot_contract_fixture_script.py --cov=scripts --cov-branch --cov-report=json:"$RUNNER_TEMP/python-coverage-contract-fixture.json" --cov-fail-under=0 -q
          uv run python -m coverage report --include=scripts/pilot_contract_fixture.py --fail-under=100
      - name: Durable current authorization and local EVM mirror with fresh proofs
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/clearproof_test
          CLEARPROOF_PILOT_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/pilot
          CLEARPROOF_POLICY_CLI_TEST: "1"
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-mirror.data
          PYTEST_ADDOPTS: --cov=src --cov-branch --cov-report= --cov-fail-under=0
        run: uv run python scripts/test_pilot_mirror.py "$CLEARPROOF_PILOT_TEST_ARTIFACTS" --output "$RUNNER_TEMP/clearproof-pilot-run"
      - name: Build SDK and CLI for full Python acceptance tests
        run: |
          npm run build --workspace=@clearproof/content
          npm run build --workspace=@clearproof/proof
          npm run build --workspace=@clearproof/cli
      - name: Install optional native source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake nasm m4
      - name: Build pinned unapproved native test runtime
        id: native-prover
        run: |
          bash scripts/build_native_prover.sh "$RUNNER_TEMP/clearproof-native-prover"
          native_binary="$RUNNER_TEMP/clearproof-native-prover/build_prover/src/prover"
          native_sha=$(sha256sum "$native_binary")
          native_sha="${native_sha%% *}"
          printf 'binary=%s\nsha256=%s\n' "$native_binary" "$native_sha" >> "$GITHUB_OUTPUT"
      - name: Full Python coverage with PostgreSQL and both proof profiles
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/clearproof_test
          CLEARPROOF_PILOT_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/pilot
          CLEARPROOF_LEGACY_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/legacy
          CLEARPROOF_POLICY_CLI_TEST: "1"
          CLEARPROOF_RAPIDSNARK_TEST_BIN: ${{ steps.native-prover.outputs.binary }}
          CLEARPROOF_RAPIDSNARK_TEST_SHA256: ${{ steps.native-prover.outputs.sha256 }}
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-suite.data
        run: uv run python -m pytest tests --cov=src --cov-branch --cov-report=term --cov-fail-under=0 -q
      - name: Cover checkpoint verification on its owned EVM
        env:
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-checkpoint.data
          PYTEST_ADDOPTS: --cov=src --cov-branch --cov-report= --cov-fail-under=0
        run: uv run python scripts/test_checkpoint_evm.py
      - name: Combine full Python evidence and require complete coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage-combined.data
        run: |
          uv run python -m coverage combine --keep "$RUNNER_TEMP/python-coverage-suite.data" "$RUNNER_TEMP/python-coverage-checkpoint.data" "$RUNNER_TEMP/python-coverage-mirror.data"
          uv run python -m coverage json -o "$RUNNER_TEMP/python-coverage-combined.json" --fail-under=0
          uv run python -m coverage report --fail-under=100
      - name: Retain full Python coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-full-coverage
          path: ${{ runner.temp }}/python-coverage-*
          if-no-files-found: error
          retention-days: 7
      - name: Full Solidity coverage with fresh legacy and pilot proofs
        env:
          CLEARPROOF_PILOT_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/pilot
          CLEARPROOF_LEGACY_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/legacy
        run: npm run test:coverage --workspace=@clearproof/contracts
      - name: Restore normal contract bytecode
        if: always()
        run: npm exec --workspace=@clearproof/contracts -- hardhat compile --force
      - name: Full normal-bytecode contract verification
        env:
          CLEARPROOF_PILOT_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/pilot
          CLEARPROOF_LEGACY_TEST_ARTIFACTS: ${{ runner.temp }}/clearproof-development-circuits/legacy
        run: npm exec --workspace=@clearproof/contracts -- hardhat test --no-compile
      - name: Retain Solidity coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidity-coverage
          path: |
            packages/contracts/coverage/
            packages/contracts/coverage.json
          retention-days: 7
      - name: Upload synthetic pilot reports and encrypted export
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SYNTHETIC-development-pilot-reports
          path: |
            ${{ runner.temp }}/clearproof-pilot-run/run.json
            ${{ runner.temp }}/clearproof-pilot-run/reports/
          if-no-files-found: error
      - name: Upload unapproved development artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNAPPROVED-development-circuit-artifacts
          path: |
            ${{ runner.temp }}/clearproof-development-circuits/DEVELOPMENT-ONLY.txt
            ${{ runner.temp }}/clearproof-development-circuits/ptau-sha256.txt
            ${{ runner.temp }}/clearproof-development-circuits/source-inventory.json
            ${{ runner.temp }}/clearproof-development-circuits/legacy/
            ${{ runner.temp }}/clearproof-development-circuits/pilot/
          retention-days: 7

  # Preserve the existing required check while labeling the actual artifact job.
  circuits:
    needs: [development-circuits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful unapproved development acceptance
        env:
          DEVELOPMENT_RESULT: ${{ needs.development-circuits.result }}
        run: test "$DEVELOPMENT_RESULT" = success

  python-aggregate-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [operational-tests, circuits]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operational-python-coverage
          path: coverage-input/operational
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-full-coverage
          path: coverage-input/full
      - name: Combine application and every operational Python script
        env:
          COVERAGE_FILE: ${{ runner.temp }}/repository-python-coverage.data
        run: |
          uv run python -m coverage combine --keep \
            coverage-input/full/python-coverage-combined.data \
            coverage-input/operational/operational-coverage.data \
            coverage-input/full/python-coverage-development-combined.data \
            coverage-input/full/python-coverage-contract-fixture.data
          uv run python -m coverage json -o "$RUNNER_TEMP/repository-python-coverage.json" --fail-under=0
          uv run python -m coverage report --fail-under=100
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repository-python-coverage
          path: ${{ runner.temp }}/repository-python-coverage.*
          if-no-files-found: error
          retention-days: 7

  circuit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # circuits include ../node_modules/circomlib — needed for include resolution
      - run: npm ci
      # ubuntu-latest runners ship rustup + stable cargo; no toolchain action needed
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install circomspect
        run: cargo install circomspect --locked
      - name: Static-analysis gate on circuits
        run: bash scripts/circuit_lint.sh

  protobuf-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Verify committed gRPC stubs match protos/
        run: bash scripts/regen_protobufs.sh --check

  license-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: REUSE compliance (SPDX license metadata)
        run: uvx reuse lint
