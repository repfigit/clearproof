name: Release
on:
  release:
    types: [published]

permissions:
  contents: read

# Never cancel a publish that is already running; queue a second release instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install -g npm@11.9.0
      - name: Locked install
        run: npm ci
      - name: Build published packages
        run: npx turbo run build --filter=@clearproof/content --filter=@clearproof/proof --filter=@clearproof/cli
      - name: Compile contracts
        run: cd packages/contracts && npx hardhat compile
      # Publish in dependency order: the CLI depends on content and proof.
      # Authentication is npm trusted publishing (OIDC, id-token: write above); no token is
      # stored. Each package needs a trusted publisher on npmjs.com for repfigit/clearproof
      # and release.yml. Provenance attestations are generated automatically.
      # Versions already on the registry are skipped, so a partial release can be re-run.
      - name: Publish to npm
        run: |
          set -euo pipefail
          # circuits' prepack copies the canonical circuits/ sources into the package (source only).
          for dir in circuits content proof cli contracts; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            (cd "packages/$dir" && npm publish --access public)
          done

  publish-pypi:
    # Disabled until a PyPI trusted publisher exists for this repository and
    # workflow; set the repository variable PUBLISH_PYPI=true to enable.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # PyPI trusted publisher (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Requires a trusted publisher configured on PyPI for repo
        # repfigit/clearproof, workflow release.yml, environment optional.
