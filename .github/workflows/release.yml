name: Release
on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Locked install
        run: npm exec --yes --package=npm@11.9.0 -- npm ci
      - name: Build published packages
        run: npx turbo run build --filter=@clearproof/content --filter=@clearproof/proof --filter=@clearproof/cli
      - name: Compile contracts
        run: cd packages/contracts && npx hardhat compile
      # Publish in dependency order: the CLI depends on content and proof.
      # Versions already on the registry are skipped, so a partial release can be re-run.
      # --provenance publishes Sigstore build attestations (requires id-token: write above).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in content proof cli contracts; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            (cd "packages/$dir" && npm publish --access public --provenance)
          done

  publish-pypi:
    # Disabled until a PyPI trusted publisher exists for this repository and
    # workflow; set the repository variable PUBLISH_PYPI=true to enable.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publisher (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Requires a trusted publisher configured on PyPI for repo
        # repfigit/clearproof, workflow release.yml, environment optional.
