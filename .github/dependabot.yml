version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Root npm workspace (packages/* and apps/* share the root package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major migrations tracked as deliberate work, not automated bumps:
      # TypeScript 7 (native compiler) breaks the workspace builds; Hardhat 3 is an ESM/config rewrite.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: hardhat
        update-types: ["version-update:semver-major"]

  # Python project locked with uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned in pyproject.toml: SIWE 4.4.0 redefines ABNF core rules that abnf >2.6.0 rejects.
      - dependency-name: abnf
      # protobuf 7 should come with stubs regenerated by a protoc 7 toolchain (scripts/regen_protobufs.sh).
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]
