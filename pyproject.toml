[project]
name = "clearproof"
version = "0.4.0"
description = "ZK Travel Rule Compliance Bridge — replace raw PII with zero-knowledge proofs for FATF Travel Rule compliance"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "cryptography>=42.0",
    "grpcio>=1.62",
    "PyJWT[crypto]>=2.8",
    "web3>=7.0",
    "siwe>=4.0",
    "psycopg[binary,pool]>=3.2",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
# zk extra: ezkl-based zkML advisory scoring for SAR risk classification.
# Intended use: run a trained ezkl model on transaction metadata to produce
# a risk score (0-100) that feeds the SAR advisory workflow. Not required
# for core ZK compliance proofs (those use the Circom/snarkjs path).
zk = [
    "ezkl>=15.0",
    "torch>=2.2",
    "onnx>=1.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
    "grpcio>=1.62",
    "aiosqlite>=0.20",
]
all = ["clearproof[zk,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

# Generated protobuf files must never be edited (see root AGENTS.md)
extend-exclude = [
    "src/protocol/bridges/*_pb2.py",
    "src/protocol/bridges/*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
