# REUSE compliance metadata (https://reuse.software/spec-3.3).
# Bulk-declares licensing for the whole repo; individual files may override
# with SPDX headers (per-file headers take precedence over "aggregate").
version = 1
SPDX-PackageName = "clearproof"
SPDX-PackageSupplier = "clearproof contributors <https://github.com/repfigit/clearproof>"
SPDX-PackageDownloadLocation = "https://github.com/repfigit/clearproof"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 clearproof contributors"
SPDX-License-Identifier = "Apache-2.0"

# Pairing.sol is the MIT-licensed alt_bn128 pairing library by Christian
# Reitwiessner (2017), ported to Solidity 0.8 by clearproof. Per-file MIT
# header retained; listed here so the copyright attribution is explicit.
# See NOTICE and docs/adr/0001-groth16-verifier-licensing.md.
[[annotations]]
path = "packages/contracts/contracts/Pairing.sol"
precedence = "override"
SPDX-FileCopyrightText = "2017 Christian Reitwiessner"
SPDX-License-Identifier = "MIT"
